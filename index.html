<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Bazar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Tienda Bazar de Delegados Asociacion Padres de Famlia </h1><br>
	
	<h1>Gimnasio Los Monjes </h1>

<img src="Dia de la familia 2026.png" alt="Celebracion del Dia de la familia Mayo 2026" class="leoncio">
	
    <div class="contenedor-tienda">

		<div class="producto">
    		<p>Gaseosa - $2000</p>
    		<button onclick="agregarAlCarrito('Gaseosa', 2000)">Agregar</button>
    		<span id="contador-Gaseosa">
			<span class="confirmacion"></span>
		</div>


        <div class="producto">
            <p>Jugo - $2000</p>
            <button onclick="agregarAlCarrito('Jugo', 2000)">Agregar</button>
	   		<span id="contador-Jugo"
            <span class="confirmacion"></span>
        </div>

        <div class="producto">
            <p>Agua - $1000</p>
            <button onclick="agregarAlCarrito('Agua', 1000)">Agregar</button>
	    	<span id="contador-Agua"            
			<span class="confirmacion"></span>
        </div>

		<div class="producto">
  			<p>Tinto - $1000</p>
  			<button onclick="agregarAlCarrito('Tinto', 1000)">Agregar</button>
  			<span id="contador-Tinto"
			<span class="confirmacion"></span>
		</div>
       
		<div class="producto">
            <p>Arepa con queso - $2000</p>
            <button onclick="agregarAlCarrito('Arepa', 2000)">Agregar</button>
	    <span id="contador-Arepa"
            <span class="confirmacion"></span>
		</div>

 <div class="producto">
            <p>Empanada - $2500</p>
            <button onclick="agregarAlCarrito('Empanada', 2500)">Agregar</button>
	    <span id="contador-Empanada"
            <span class="confirmacion"></span>
        </div>

   <div class="producto">
            <p>Salpicon - $3500</p>
            <button onclick="agregarAlCarrito('Salpicon', 3500)">Agregar</button>
	    	<span id="contador-Salpicon"
            <span class="confirmacion"></span>
        </div>		

  <div class="producto">
            <p>LECHONA - $14000</p>
            <button onclick="agregarAlCarrito('LECHONA', 14000)">Agregar</button>
	    	<span id="contador-LECHONA"
            <span class="confirmacion"></span>
        </div>	
		
   <div class="producto">
            <p>Obleas - $4000</p>
            <button onclick="agregarAlCarrito('Obleas', 4000)">Agregar</button>
	    	<span id="contador-Obleas"
            <span class="confirmacion"></span>
        </div>


	</div>

    <br>
    <button onclick="window.location.href='carritotiendabazar.html'">Ir al Carrito</button>

<script>
    function agregarAlCarrito(nombre, precio) {
        let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
        let productoExistente = carrito.find(item => item.nombre === nombre);

        if (productoExistente) {
            productoExistente.cantidad += 1;
        } else {
            carrito.push({ nombre, precio, cantidad: 1 });
        }

        localStorage.setItem("carrito", JSON.stringify(carrito));

  // 🛠️ Actualizar el contador en la tienda
    let contadorElemento = document.getElementById(`contador-${nombre}`);
    if (contadorElemento) {
        let cantidadActualizada = carrito.find(item => item.nombre === nombre).cantidad;
        contadorElemento.innerText = cantidadActualizada;
        }

        // ✅ Mostrar mensaje de agregado
        let mensaje = event.target.nextElementSibling;
        mensaje.innerText = "✓ Agregado";
        mensaje.style.color = "green";

        setTimeout(() => {
            mensaje.innerText = "";
        }, 1500);
    }
</script>


</body>
</html>
